name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt pytest
          python -m pip install -r registration_service/requirements.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          run_school_csm_control_center.py
          run_district_management_server.py
          school_csm_control_center
          district_management_server
          registration_service
          scripts

      - name: Run tests
        shell: pwsh
        run: |
          $testOutput = & python -m unittest discover -s tests -q 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "unittest.log")
          if ($testExitCode -ne 0) {
            $failureSummary = ($testOutput | Select-Object -Last 160) -join "`n"
            $failureSummary = $failureSummary.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Python test suite failed::$failureSummary"
            exit $testExitCode
          }

      - name: Run Cloudflare Worker contract tests
        run: >-
          node --test
          cloudflare_worker/test/proxy.test.mjs
          district_gateway_worker/test/proxy.test.mjs
          registration_service/test/district.test.mjs

      - name: Check generated version resource
        shell: pwsh
        run: |
          python scripts/generate_version_info.py | Out-Null
          python scripts/generate_version_info.py --output packaging/pyinstaller/district_version_info.txt --product-name "School CSM District Management Server" --original-filename "School CSM District Management Server.exe" | Out-Null
          git diff --exit-code -- packaging/pyinstaller/version_info.txt
          git diff --exit-code -- packaging/pyinstaller/district_version_info.txt

      - name: Compile maintenance installer
        shell: pwsh
        run: >-
          ./scripts/build_installer.ps1
          -Repository "${{ github.repository }}"
          -OutputRoot "release/installer-check"

      - name: Compile district maintenance installer
        shell: pwsh
        run: >-
          ./scripts/build_installer.ps1
          -Repository "${{ github.repository }}"
          -Product District
          -OutputRoot "release/district-installer-check"

      - name: Upload installer compile check
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-installer-compile-check
          path: release/installer-check/School-CSM-Control-Center-Setup.exe
          if-no-files-found: error

  district-build-isolated:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: district_management_server/requirements-lock.txt

      - name: Install only district build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r district_management_server/requirements-lock.txt

      - name: Build and self-test isolated district executable
        shell: pwsh
        run: |
          ./scripts/build_district_management_server.ps1 `
            -Python python `
            -OutputRoot release/district-ci `
            -Clean
          $analysis = Get-Content `
            -LiteralPath release/district-ci/pyinstaller-work/DistrictManagementServer/Analysis-00.toc `
            -Raw
          if ($analysis -match "school_csm_control_center") {
            throw "The district executable imported the school Control Center package."
          }

      - name: Upload isolated district compile check
        uses: actions/upload-artifact@v4
        with:
          name: district-management-server-compile-check
          path: release/district-ci/artifacts/*
          if-no-files-found: error
